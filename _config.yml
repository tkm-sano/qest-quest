# Site config
title: "Q/est"
url: "https://q-est.org"      # production URL (leave empty for local)
baseurl: ""                    # if served from a subpath, set like "/qest-quest_jekyll"

# Locale / build
timezone: Asia/Tokyo
lang: ja
markdown: kramdown

# Theme & plugins
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Defaults
defaults:
  - scope:
      path: ""
    values:
      lang: ja

# Include additional static paths
include:
  - assets/data
  - assets/.well-known

# Keep development files out of the published site. The mixer itself is a
# plain static subtree; preserve its HTML, CSS, JavaScript and image paths.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - quantum-image-mixer/README.md
  - quantum-image-mixer/package.json
  - quantum-image-mixer/test
  - quantum-image-mixer/scripts
  - quantum-image-mixer/assets/kyoseikan/prompts.json
  - quantum-image-mixer/assets/yukichi/prompts.json

# Collections
collections:
  news:
    output: true
    permalink: /projects/:slug/
  activities:
    output: true
    permalink: /activities/:slug/
